<div class="course-feedback-window bg-light border shadow" role="dialog" aria-modal="false" aria-labelledby="course-feedback-window-title">
    <div class="course-feedback-window-header">
        <h2 class="course-feedback-window-title" id="course-feedback-window-title"></h2>
        <a class="course-feedback-window-button" target="_blank" rel="noopener" aria-label="{{t:courses.originalFeedback.newWindow}}" title="{{t:courses.originalFeedback.newWindow}}"><i class="fas fa-external-link-alt" aria-hidden="true"></i></a>
        <button type="button" class="close course-feedback-window-button" aria-label="{{t:courses.close}}"><span aria-hidden="true">&times;</span></button>
    </div>
    <iframe class="course-feedback-window-frame" referrerpolicy="no-referrer"></iframe>
    <div class="course-feedback-window-note small text-muted">{{t:courses.originalFeedback.note}}</div>
</div>
